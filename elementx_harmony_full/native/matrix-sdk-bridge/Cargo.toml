[package]
name = "elementx-matrix-sdk-bridge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "elementx_matrix_sdk_bridge"
crate-type = ["staticlib", "rlib"]

[features]
default = []
matrix-sdk = ["dep:matrix-sdk", "dep:tokio"]

[dependencies]
matrix-sdk = { path = "../../../_worktrees/matrix-rust-sdk-2214aded/crates/matrix-sdk", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1.48.0", default-features = false, features = ["rt-multi-thread"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = false
codegen-units = 16
panic = "abort"
