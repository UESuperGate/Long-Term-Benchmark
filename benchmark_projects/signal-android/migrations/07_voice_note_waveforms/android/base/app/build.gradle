apply plugin: 'com.android.application'

android {
    namespace 'org.signal.benchmark.waveform.base'
    compileSdk 37

    defaultConfig {
        applicationId 'org.signal.benchmark.waveform.base'
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName '8.28.4-base'
        testInstrumentationRunner 'org.signal.benchmark.waveform.evaluator.VoiceWaveformInstrumentation'
    }

    sourceSets {
        androidTest.java.srcDirs += '../../evaluator/androidTest/java'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
