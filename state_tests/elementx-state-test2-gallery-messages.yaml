version: 1
task:
  id: 02_gallery_messages
  title: 图库消息渲染与操作
  base: v26.06.1
  final: v26.08.1
source:
  spec: C:/Users/xiexi/qingyu/specs/elementx-spec2-gallery-messages.md
  release_notes:
    - Support gallery messages
    - Add item count text as the placeholder for in reply to box for galleries
    - Add content scanner support to media gallery and viewer
  android_evidence:
    - TimelineItemGalleryContent(items, caption, showCaption)
    - GalleryItem.Type.Image/Video/Audio/File
    - ActionListPresenter handles TimelineItemGalleryContent
    - MediaViewerDataSource and GalleryMediaGalleryDataSource
platform_bindings:
  android:
    state_holders:
      - TimelineItemGalleryContent.items
      - TimelineItemGalleryContent.caption
      - GalleryItem.type / mimeType / thumbnailSource
      - ContentValidationState.getMediaStateFlow(url)
      - MediaViewerState selected event/gallery item
      - ActionListState for selected TimelineItemGalleryContent
    render_targets:
      - TimelineItemGalleryView
      - TimelineItemEventContentView
      - ActionListView
      - InReplyToView
      - MediaViewerView
      - MediaGalleryView
    event_entrypoints:
      - gallery_item_click(index)
      - long_press_timeline_item
      - reply_to_event
      - share_or_forward_event
      - content_validation_update(url, value)
  arkts:
    state_holders:
      - TimelineEvent.kind == Gallery
      - TimelineEvent.mediaItems
      - TimelineEvent.caption
      - Index.@State.mediaViewerEventId
      - Index.@State.mediaViewerItemIndex
      - Index.@State.mediaViewerActionStatus
      - Index.@State.pendingShareAttachmentRows
      - ContentScannerContract scan result fixture
    render_targets:
      - Gallery timeline row
      - GalleryMediaTile
      - Media viewer surface
      - Action sheet
      - Reply preview
      - Share target picker
    event_entrypoints:
      - openGalleryItem(eventId, index)
      - updateMediaValidation(eventId, mediaUrl, state)
      - openActionSheet(eventId)
      - replyToEvent(eventId)
      - shareGallery(eventId)
state_dimensions:
  - name: gallery_support
    values: [unsupported, supported]
  - name: item_count
    values: [0, 1, 2, 4]
  - name: item_mix
    values: [visual_only, mixed_media, file_only]
  - name: caption
    values: [none, plain, formatted]
  - name: validation
    values: [unknown, loading, valid, invalid, unrecoverable_error]
  - name: viewer
    values: [closed, opened_selected_item, opened_error_item]
  - name: item_order
    values: [stable, reordered_bug]
  - name: event_replacement
    values: [none, edited, redacted]
  - name: validation_by_item
    values: [all_valid, mixed_valid_invalid, partial_error]
  - name: share_payload_count
    values: [0, 1, 2, 4]
quality_gates:
  minimum_cases: 28
  required_functional_areas: [timeline_rendering, media_viewer, content_scanning, reply_preview, action_menu, share_forward, pinned_event]
  discrimination_rules:
    - every case is a final-positive gallery requirement; base mirrors must fail because gallery remains unsupported or incomplete
    - a final pass requires preserving attachment count, order, per-item type, caption and safety state
    - single-media behavior is only a regression constraint when tied to gallery coexistence
    - feature_available alone is never sufficient evidence
cases:
  - id: gm_state_001_supported_gallery_row
    title: 多附件 gallery 在时间线中作为支持类型渲染
    functional_area: timeline_rendering
    fixture_kind: declarative_state_fixture
    base_failure_signal: base target lacks the final semantic state, transition, or UI binding required by this case
    runtime_oracle:
      state_vector: true
      ui_tree_tokens: true
      transition_steps: auto
      cross_platform_parity: true
    mutation_guards:
      - rejects_feature_flag_only_completion
      - rejects_missing_timeline_rendering_binding
    given_state:
      gallery_support: supported
      item_count: 4
      item_mix: mixed_media
      caption: plain
      validation: valid
      viewer: closed
    expect_ui:
      visible: [gallery_container, gallery_item_0, gallery_item_1, gallery_item_2, gallery_item_3, gallery_caption]
      hidden: [unsupported_event_placeholder]
      enabled: [gallery_item_0, gallery_item_1, gallery_item_2, gallery_item_3]
    parity_assertions:
      - Android TimelineItemGalleryContent and ArkTS TimelineEventKind.Gallery expose the same item count.

