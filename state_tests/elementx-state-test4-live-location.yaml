version: 1
task:
  id: 04_live_location
  title: 实时位置分享
  base: v26.04.0
  final: v26.05.1
source:
  spec: C:/Users/xiexi/qingyu/specs/elementx-spec4-live-location.md
  release_notes:
    - Feature: share live location
    - Prevent user from starting Live Location Sharing in thread
    - Remove LiveLocationSharing feature flag
  android_evidence:
    - ShareLocationState.canShareLiveLocation
    - ShareLocationState.dialogState
    - ShareLocationPresenter.pendingLiveLocationShare
    - ActiveLiveLocationShareManager.isCurrentlySharing(roomId)
    - ShowLocationState.isLive / locationShares / focusedLocation
    - LiveLocationSharingBanner
platform_bindings:
  android:
    state_holders:
      - ShareLocationState.canShareLiveLocation
      - ShareLocationState.dialogState
      - ShareLocationState.startLiveLocationAction
      - ShareLocationState.userLocationState
      - ActiveLiveLocationShareManager.isCurrentlySharing(roomId)
      - LiveLocationStore expiry map
      - ShowLocationState.isLive
      - ShowLocationState.locationShares
      - LocationShareItem.canStopSharing
    render_targets:
      - ShareLocationView
      - LiveLocationSharingBanner
      - TimelineItemLocationView
      - ShowLocationView
    event_entrypoints:
      - ShareLocationEvent.InitiateLiveLocationShare
      - ShareLocationEvent.StartLiveLocationShare(duration)
      - ActiveLiveLocationShareManager.startShare(roomId, duration)
      - ActiveLiveLocationShareManager.stopShare(roomId)
      - location tick / timeout tick
  arkts:
    state_holders:
      - TimelineEvent.kind == LiveLocation
      - TimelineEvent.liveLocation.active
      - TimelineEvent.liveLocation.lastLocation
      - SyncRuntimeState.sharingLiveLocation
      - Index live-location banner state
      - FixtureMatrixClientAdapter live location session
    render_targets:
      - Share location panel
      - Live location timeline row
      - Live map view
      - Active sharing banner
    event_entrypoints:
      - startLiveLocation(roomId, duration)
      - stopLiveLocation(roomId)
      - updateLiveLocation(roomId, lat, lon)
      - expireLiveLocation(roomId)
state_dimensions:
  - name: context
    values: [room, thread]
  - name: permission
    values: [unknown, denied, granted]
  - name: dialog
    values: [none, constraints, disclaimer, duration_picker]
  - name: share_action
    values: [idle, loading, success, failure]
  - name: live_session
    values: [inactive, starting, active, stopped, expired]
  - name: map
    values: [closed, opened_loading, opened_with_location, opened_no_location]
  - name: active_share
    values: [none, own_active, remote_active, multiple_active]
  - name: timeline_item
    values: [none, live_active, live_ended, static_location]
  - name: last_location
    values: [none, fresh, stale]
  - name: notification
    values: [none, live_location_started]
  - name: surface
    values: [composer, room_timeline, map, banner, notification]
quality_gates:
  minimum_cases: 30
  required_functional_areas: [composer_gate, permission_flow, active_manager, timeline_item, map_view, banner, stop_timeout, notification, failure_recovery]
  discrimination_rules:
    - every case is a final-positive live-location requirement; base mirrors must fail because the full active-share loop is absent
    - a final pass requires state propagation between manager, timeline, map and banner
    - static location behavior is only a regression constraint when live and static items coexist
    - feature_available alone is never sufficient evidence
