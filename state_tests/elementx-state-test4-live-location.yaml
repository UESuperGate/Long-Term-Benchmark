    runtime_oracle:
      state_vector: true
      ui_tree_tokens: true
      transition_steps: auto
      cross_platform_parity: true
    mutation_guards:
      - rejects_feature_flag_only_completion
      - rejects_missing_composer_gate_binding
    given_state:
      context: room
      permission: granted
      dialog: none
      live_session: inactive
      share_action: idle
    expect_ui:
      visible: [share_location_entry, live_location_entry]
      enabled: [live_location_entry]
      hidden: [thread_live_location_blocked_message]
    transitions:
      - event: initiate_live_location_share
