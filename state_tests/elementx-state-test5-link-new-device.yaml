      transition_steps: auto
      cross_platform_parity: true
    mutation_guards:
      - rejects_feature_flag_only_completion
      - rejects_missing_capability_binding
    given_state:
      support: unknown
      owner_verification: not_requested
      flow_mode: none
      qr_data: none
      timeout: not_started
    expect_ui:
      visible: [link_new_device_entry_loading]
      hidden: [qr_code_view, owner_verification_gate, timeout_notice]
    transitions:
      - event: can_link_new_device_success(true)
