version: 1
task:
  id: 05_link_new_device
  title: 新设备登录与二维码超时保护
  base: v26.05.0
  final: v26.08.2
source:
  spec: C:/Users/xiexi/qingyu/specs/elementx-spec5-link-new-device.md
  release_notes:
    - Protect link new device
    - QR code login iteration
    - Add timeout
    - Disable QrCode rotation
    - Move timeout management to LinkNewDeviceFlowNode
  android_evidence:
    - LinkNewDeviceRootState.isSupported
    - LinkNewDeviceRootState.qrCodeData
    - ScanQrCodeState.scanAction
    - ShowQrCodeState.data
    - LinkNewMobileHandler / LinkNewDesktopHandler split steps
platform_bindings:
  android:
    state_holders:
      - LinkNewDeviceRootState.isSupported
      - LinkNewDeviceRootState.qrCodeData
      - ScanQrCodeState.scanAction
      - ShowQrCodeState.data
      - AsyncData.Loading/Success/Failure
      - AsyncAction.Uninitialized/Loading/Success/Failure
      - owner verification result from flow node
      - timeout state in LinkNewDeviceFlowNode
    render_targets:
      - LinkNewDeviceRootView
      - ScanQrCodeView
      - ShowQrCodeView
      - DesktopNoticeView
      - ErrorView
      - CompleteVerificationView
    event_entrypoints:
      - LinkNewDeviceRootEvent
      - ScanQrCodeEvent.QrCodeScanned
      - ScanQrCodeEvent.TryAgain
      - owner_verification_success/failure/cancel
      - timer_tick
      - sdk_link_step
  arkts:
    state_holders:
      - HomeserverCapabilitiesState.canLinkNewDevice
      - ClientAuthState.QrLogin
      - LinkNewDeviceHandlerState.mode
      - LinkNewDeviceHandlerState.qrCodeData
      - LinkNewDeviceHandlerState.ownerVerified
      - LinkNewDeviceHandlerState.expiresAtMs
      - Index.@State.authState
    render_targets:
      - Security settings link-device entry
      - Owner verification gate
      - QR scan screen
      - Desktop notice screen
      - Timeout notice
      - Success/done screen
      - Error screen
    event_entrypoints:
      - canLinkNewDevice()
      - createLinkMobileHandler()
      - createLinkDesktopHandler()
      - verifyOwner()
      - scanQrCode(payload)
      - linkDeviceTimerTick(nowMs)
      - retryLinkNewDevice()
state_dimensions:
  - name: support
    values: [unknown, supported, unsupported, failure]
  - name: owner_verification
    values: [not_requested, required, loading, passed, failed, cancelled]
  - name: flow_mode
    values: [none, mobile_scan, desktop_notice, show_qr, digits, complete, error]
  - name: qr_data
    values: [none, loading, available, expired, failure]
  - name: scan_action
    values: [idle, loading, success, failure]
  - name: timeout
    values: [not_started, running, expired]
  - name: attempt_id
    values: [none, old_attempt, new_attempt]
  - name: auth_error
    values: [none, biometric_failure, biometric_lockout]
  - name: digits_match
    values: [pending, match, mismatch]
  - name: handler_state
    values: [none, active, cleaned]
quality_gates:
  minimum_cases: 34
  required_functional_areas: [capability, owner_gate, mobile_scan, desktop_qr, digits, timeout_retry, sdk_error_mapping, cleanup, stale_event_protection]
  discrimination_rules:
    - every case is a final-positive security requirement; base mirrors must fail on owner gate, timeout, split steps or cleanup
    - a final pass requires proving QR is both protected before verification and available after successful verification
    - stale timer/SDK events must be tied to attempt identity
    - feature_available alone is never sufficient evidence
