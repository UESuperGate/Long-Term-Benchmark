version: 1
task:
  id: 03_timeline_protection_rich_events
  title: 时间线安全扫描与富事件渲染升级
  base: v26.07.1
  final: v26.08.0
source:
  spec: C:/Users/xiexi/qingyu/specs/elementx-spec3-active-call-timeline.md
  release_notes:
    - Content scanner: scan timeline events for unsafe content
    - Add content scanner support to media gallery and viewer
    - feat(call): Active call timeline rendering
  android_evidence:
    - TimelineProtectionState.protectionState
    - ContentValidationState / ContentValidationValue
    - TimelineItemEventContent.isMedia
    - TimelineItemRtcNotificationContent.state
    - ActiveCallTimelineItemView
platform_bindings:
  android:
    state_holders:
      - MessagesState.timelineProtectionState
      - TimelineProtectionState.protectionState
      - ContentValidationState.overallStateFlow
      - ContentValidationValue.Valid/Invalid/Loading/Unknown/UnrecoverableError
      - TimelineItemEventContent.isMedia
      - TimelineItemRtcNotificationContent.state
      - RtcNotificationState.Active/Declined/Started
    render_targets:
      - TimelineView
      - TimelineItemEventRow
      - TimelineItemImageView
      - TimelineItemVideoView
      - TimelineItemGalleryView
      - MessageShieldView
      - ActiveCallTimelineItemView
      - MediaViewerView
    event_entrypoints:
      - TimelineProtectionEvent
      - contentValidationState.update(url, value)
      - AsyncImageStateHandler update
      - active_call_join_click
  arkts:
    state_holders:
      - TimelineEvent.kind
      - TimelineEvent.mediaItems
      - TimelineEvent.validationState
      - TimelineEvent.callState
      - ContentScannerContract scan result
      - Index.@State.mediaViewerEventId
      - Index.@State.mediaViewerItemIndex
      - Index.@State.mediaViewerActionStatus
    render_targets:
      - Timeline row
      - Media tile
      - Scan fallback row
      - Gallery row
      - Active call row
      - Media viewer
    event_entrypoints:
      - updateContentScan(eventId, mediaUrl, value)
      - asyncImageStateChanged(mediaUrl, value)
      - openMediaViewer(eventId, index)
      - joinActiveCall(eventId)
state_dimensions:
  - name: protection
    values: [render_all, render_only_selected]
  - name: validation
    values: [unknown, loading, valid, invalid, unrecoverable_error]
  - name: event_content
    values: [text, image, video, file, voice, sticker, gallery, active_call, rtc_declined]
  - name: viewer
    values: [closed, opened, blocked]
  - name: call_state
    values: [none, active_joinable, active_joined, declined, started_tombstoned]
  - name: validation_cache
    values: [empty, cached_valid, cached_invalid]
  - name: action_sheet
    values: [closed, opened]
  - name: event_identity
    values: [single_event, mixed_text_and_media, cached_media, active_call]
quality_gates:
  minimum_cases: 32
  required_functional_areas: [timeline_scanner, media_viewer, validation_cache, gallery_aggregation, active_call, action_menu, accessibility_navigation]
  discrimination_rules:
    - every case is a final-positive requirement for scanner, rich call rendering, or their coexistence
    - a final pass requires proving unsafe content is blocked without disabling safe media or text events
    - validation state must be keyed by event/media/call identity, not a global flag
    - feature_available alone is never sufficient evidence
cases:
  - id: tp_state_001_media_unknown_requests_validation
    title: 未知媒体内容进入扫描准备态
    functional_area: timeline_scanner
    fixture_kind: declarative_state_fixture
    base_failure_signal: base target lacks the final semantic state, transition, or UI binding required by this case
    runtime_oracle:
      state_vector: true
      ui_tree_tokens: true
      transition_steps: auto
      cross_platform_parity: true
    mutation_guards:
      - rejects_feature_flag_only_completion
      - rejects_missing_timeline_scanner_binding
    given_state:
      protection: render_all
      validation: unknown
      event_content: image
      viewer: closed
    expect_ui:
      visible: [media_row_placeholder, content_validation_pending]
      hidden: [unsafe_content_warning, unsupported_event_placeholder]
    transitions:
      - event: scanner_started
        to_state:
          validation: loading
        expect_ui:
          visible: [content_scanning_placeholder]

