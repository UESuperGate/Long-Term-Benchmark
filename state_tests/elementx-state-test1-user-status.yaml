version: 1
task:
  id: 01_user_status
  title: 用户状态设置与展示
  base: v26.07.0
  final: v26.08.4
source:
  spec: C:/Users/xiexi/qingyu/specs/elementx-spec1-user-status.md
  release_notes:
    - Enable user status feature and hide status text in the timeline
    - Remove UserStatus feature flag
    - Add MatrixClient.isUserStatusSupported
  android_evidence:
    - features/preferences/impl/.../userstatus/UserStatusState.kt
    - features/preferences/impl/.../root/PreferencesRootState.kt:userStatusState
    - features/home/impl/.../RoomListRoomSummary.kt:dmUserStatus
    - features/messages/impl/.../MessagesState.kt
platform_bindings:
  android:
    state_holders:
      - PreferencesRootState.userStatusState
      - UserStatusState.displayedStatus
      - UserStatusState.rawStatus
      - UserStatusState.pickerState
      - UserStatusState.updateStatusAction
      - RoomListRoomSummary.dmUserStatus
      - MessagesState.currentUser / sender DisplayedStatus fixtures
    render_targets:
      - PreferencesRootView
      - UserStatusView
      - RoomSummaryRow
      - MessagesViewTopBar
      - TimelineItemEventRow sender display
    event_entrypoints:
      - UserStatusEvent.SelectPredefined
      - UserStatusEvent.EnterCustomStatus
      - UserStatusEvent.Save
      - UserStatusEvent.Clear
      - UserStatusEvent.DismissPicker
  arkts:
    state_holders:
      - Index.@State.userStatusDraft
      - Index.@State.isUpdatingProfile
      - Index.@State.profileError
      - Index.@State.pendingUserProfileStatus
      - ClientSnapshot.currentUser.status
      - RoomSummary.dmUserStatus
      - TimelineEvent.senderStatus
      - HomeserverCapabilitiesState.canSetUserStatus
    render_targets:
      - Settings/Profile section
      - User status editor surface
      - Room list row
      - Timeline sender header
      - User profile sheet
    event_entrypoints:
      - setUserStatus(status)
      - clearUserStatus()
      - isUserStatusSupported()
state_dimensions:
  - name: support
    values: [unsupported, supported]
  - name: own_status
    values: [none, user_set, in_call]
  - name: picker
    values: [hidden, predefined, custom_input, emoji_sheet_loading, emoji_sheet_shown]
  - name: update_action
    values: [idle, loading, success, failure]
  - name: surface
    values: [settings, home_top_bar, dm_room_row, timeline_sender, user_profile]
  - name: remote_status
    values: [none, user_set, refreshed, removed]
  - name: status_payload_source
    values: [none, draft, persisted, transient_call]
quality_gates:
  minimum_cases: 26
  required_functional_areas: [capability, editor, persistence, propagation, timeline, profile, failure_recovery]
  discrimination_rules:
    - every case is a final-positive requirement; base mirrors must fail because the semantic state or transition is absent
    - a final pass requires UI tokens from expect_ui plus transition/property checks when present
    - feature_available alone is never sufficient evidence
    - at least one mutation guard must reject a feature-flag-only implementation
cases:
  - id: us_state_001_unsupported_hides_entry
    title: homeserver 不支持用户状态时设置入口不出现
    functional_area: capability
    fixture_kind: declarative_state_fixture
    base_failure_signal: base target lacks the final semantic state, transition, or UI binding required by this case
    runtime_oracle:
      state_vector: true
      ui_tree_tokens: true
      transition_steps: auto
      cross_platform_parity: true
    mutation_guards:
      - rejects_feature_flag_only_completion
      - rejects_missing_capability_binding
    given_state:
      support: unsupported
      own_status: none
      picker: hidden
      update_action: idle
      surface: settings
    expect_ui:
      hidden: [user_status_settings_entry, user_status_editor, user_status_badge]
      visible: [profile_settings_entry, privacy_settings_entry, security_settings_entry]
    parity_assertions:
      - Android userStatusState is null or capability-gated.
      - ArkTS canSetUserStatus=false hides the same semantic entry.

