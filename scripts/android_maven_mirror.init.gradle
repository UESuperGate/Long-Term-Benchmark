import org.gradle.api.artifacts.repositories.MavenArtifactRepository

def repo1 = "https://repo1.maven.org/maven2"

def rewriteBrokenCentral = { repository ->
    if (repository instanceof MavenArtifactRepository &&
            repository.url.host == "repo.maven.apache.org") {
        repository.url = uri(repo1)
    }
}

// Included builds resolve plugins before ordinary project repositories exist.
// Keep the working Central endpoint first and retain the plugin portal for
// markers such as kotlin-dsl that are not published to Maven Central.
beforeSettings { settings ->
    settings.pluginManagement.repositories.clear()
    settings.pluginManagement.repositories {
        maven { url = uri(repo1) }
        gradlePluginPortal()
        google()
    }
    // The upstream settings add Google and JitPack afterwards. Prepend repo1
    // without clearing them because Element X has dependencies only on JitPack.
    settings.dependencyResolutionManagement.repositories {
        maven { url = uri(repo1) }
    }
}

settingsEvaluated { settings ->
    settings.dependencyResolutionManagement.repositories.configureEach(rewriteBrokenCentral)
}

gradle.beforeProject { project ->
    project.repositories.configureEach(rewriteBrokenCentral)
    project.buildscript.repositories.configureEach(rewriteBrokenCentral)
}
